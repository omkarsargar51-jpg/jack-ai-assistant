<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jack - AI Assistant</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <style>
        :root {
            --bg-color: #121212;
            --text-color: #E0E0E0;
            --primary: #FFD700;
            /* Jack's signature gold/yellow color */
            --accent: #212121;
            --log-bg: #1A1A1A;
        }

        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            height: 100vh;
            display: grid;
            grid-template-columns: 350px 1fr;
            grid-template-rows: auto 1fr auto;
            overflow: hidden;
        }

        header {
            grid-column: 1 / -1;
            padding: 20px 30px;
            background: var(--accent);
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #333;
        }

        h1 {
            margin: 0;
            font-size: 24px;
            color: var(--primary);
        }

        h1 span {
            font-weight: 300;
            color: var(--text-color);
        }

        .controls {
            display: flex;
            gap: 10px;
        }

        button,
        select {
            padding: 10px 18px;
            background: #2D2D2D;
            border: 1px solid #444;
            color: white;
            cursor: pointer;
            border-radius: 6px;
            font-size: 14px;
        }

        button:hover,
        select:hover {
            background: #3D3D3D;
        }

        #avatar-container {
            grid-row: 2 / 3;
            grid-column: 2 / 3;
            position: relative;
            background: radial-gradient(circle, #2a2a2a 0%, #121212 100%);
        }

        /* ---- CHAT SIDEBAR WRAPPER ---- */
        #chat-sidebar {
            grid-row: 2 / 4;
            grid-column: 1 / 2;
            display: flex;
            flex-direction: column;
            background: var(--log-bg);
            border-right: 2px solid #333;
            overflow: hidden;
        }

        /* ---- SIDEBAR HEADER (Clear + Topics toggle) ---- */
        #chat-sidebar-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 14px;
            background: #1f1f1f;
            border-bottom: 1px solid #333;
            flex-shrink: 0;
        }

        #chat-sidebar-header span {
            font-size: 12px;
            font-weight: 600;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }

        .sidebar-btn {
            padding: 5px 10px !important;
            font-size: 12px !important;
            background: #2a2a2a !important;
            border: 1px solid #444 !important;
            border-radius: 5px !important;
            color: #ccc !important;
            cursor: pointer;
        }

        .sidebar-btn:hover {
            background: #3a3a3a !important;
            color: white !important;
        }

        /* ---- MEMORY / TOPICS PANEL ---- */
        #memory-panel {
            background: #191919;
            border-bottom: 1px solid #2a2a2a;
            padding: 10px 14px;
            font-size: 12px;
            color: #888;
            flex-shrink: 0;
            display: none;
        }

        #memory-panel.visible { display: block; }

        #memory-panel h4 {
            margin: 0 0 8px 0;
            color: var(--primary);
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }

        .topic-tag {
            display: inline-block;
            background: #2a2a2a;
            border: 1px solid #FFD70044;
            color: #FFD700cc;
            border-radius: 12px;
            padding: 3px 9px;
            margin: 2px 3px 2px 0;
            font-size: 11px;
        }

        /* ---- CHAT LOG ---- */
        #chat-log {
            flex: 1;
            padding: 14px;
            overflow-y: auto;
            font-size: 14px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        /* ---- CHAT BUBBLES ---- */
        .msg-wrapper {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .msg-wrapper.user { align-items: flex-end; }
        .msg-wrapper.ai   { align-items: flex-start; }

        .msg-bubble {
            max-width: 88%;
            padding: 10px 14px;
            border-radius: 16px;
            line-height: 1.55;
            word-break: break-word;
            position: relative;
        }

        .msg-wrapper.user .msg-bubble {
            background: #2a2a2a;
            border: 1px solid #444;
            color: #E0E0E0;
            border-bottom-right-radius: 4px;
        }

        .msg-wrapper.ai .msg-bubble {
            background: linear-gradient(135deg, #1e1a00, #2a2200);
            border: 1px solid #FFD70044;
            color: #FFD700;
            border-bottom-left-radius: 4px;
        }

        .msg-meta {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 10px;
            color: #555;
            padding: 0 4px;
        }

        .msg-sender { font-weight: 700; color: #777; }

        .copy-btn {
            background: none !important;
            border: none !important;
            color: #555 !important;
            font-size: 11px !important;
            padding: 0 !important;
            cursor: pointer;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .msg-wrapper:hover .copy-btn { opacity: 1; }
        .copy-btn:hover { color: #FFD700 !important; background: none !important; }

        /* ---- TYPING INDICATOR ---- */
        .typing-bubble {
            background: linear-gradient(135deg, #1e1a00, #2a2200);
            border: 1px solid #FFD70033;
            border-radius: 16px;
            border-bottom-left-radius: 4px;
            padding: 12px 18px;
            display: flex;
            gap: 5px;
            align-items: center;
        }

        .typing-dot {
            width: 7px; height: 7px;
            background: #FFD700;
            border-radius: 50%;
            animation: typingBounce 1.2s infinite ease-in-out;
        }

        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes typingBounce {
            0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
            30% { transform: translateY(-6px); opacity: 1; }
        }

        /* ---- TYPEWRITER CURSOR ---- */
        .typewriter-cursor {
            display: inline-block;
            width: 2px; height: 1em;
            background: #FFD700;
            margin-left: 2px;
            vertical-align: text-bottom;
            animation: blink 0.7s steps(1) infinite;
        }

        @keyframes blink { 50% { opacity: 0; } }

        #input-container {
            grid-column: 2 / 3;
            padding: 20px 30px;
            display: flex;
            gap: 15px;
            border-top: 1px solid #333;
            background: rgba(18, 18, 18, 0.9);
        }

        #text-input {
            flex-grow: 1;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #444;
            background: #2D2D2D;
            color: white;
        }

        #status-indicator {
            position: absolute;
            bottom: 20px;
            right: 20px;
            padding: 8px 15px;
            border-radius: 20px;
            background: #2D2D2D;
            border: 1px solid #444;
            font-size: 12px;
            font-weight: bold;
        }

        #visualizer-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 80px;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            padding-bottom: 20px;
            gap: 4px;
            pointer-events: none;
        }

        .v-bar {
            width: 6px;
            height: 10px;
            background-color: rgba(255, 215, 0, 0.4);
            border-radius: 3px;
            transition: height 0.05s ease, background-color 0.2s ease;
        }

        /* =============================================
           QUESTION COUNTER BADGE
        ============================================= */
        #q-counter {
            position: absolute;
            top: 16px;
            left: 16px;
            background: rgba(30,30,30,0.85);
            border: 1px solid #FFD70066;
            border-radius: 20px;
            padding: 5px 12px;
            font-size: 12px;
            font-weight: 700;
            color: #FFD700;
            backdrop-filter: blur(6px);
            z-index: 10;
            transition: transform 0.2s, background 0.3s;
        }
        #q-counter.pulse {
            animation: counterPulse 0.4s ease;
        }
        @keyframes counterPulse {
            0%   { transform: scale(1); }
            50%  { transform: scale(1.35); background: rgba(255,215,0,0.25); }
            100% { transform: scale(1); }
        }
        #q-label { color: #666; font-weight: 400; }

        /* =============================================
           WATER BREAK OVERLAY (slim status card)
        ============================================= */
        #water-break-overlay {
            position: absolute;
            inset: 0;
            background: transparent;
            display: none;
            align-items: flex-end;
            justify-content: center;
            padding-bottom: 100px;
            z-index: 50;
            pointer-events: none;
        }
        #water-break-overlay.active { display: flex; }

        #wb-status-card {
            background: rgba(10,10,18,0.82);
            border: 1px solid #FFD70055;
            border-radius: 16px;
            padding: 14px 24px;
            text-align: center;
            backdrop-filter: blur(10px);
            animation: wbSlideUp 0.5s ease;
            min-width: 240px;
        }
        @keyframes wbSlideUp {
            from { opacity: 0; transform: translateY(20px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        #wb-emoji-icon { font-size: 28px; margin-bottom: 4px; animation: wbBob 1s ease-in-out infinite; }
        @keyframes wbBob { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-5px)} }
        #wb-status-text { font-size: 13px; color: #aaa; margin-bottom: 10px; }
        #wb-progress-wrap {
            width: 100%; height: 5px; background: #333; border-radius: 3px; overflow: hidden; margin-bottom: 6px;
        }
        #wb-progress-bar {
            height: 100%; width: 100%;
            background: linear-gradient(90deg, #4fc3f7, #0288d1);
            border-radius: 3px; transform-origin: left;
            animation: progressDrain 12s linear forwards;
        }
        @keyframes progressDrain { from{transform:scaleX(1)} to{transform:scaleX(0)} }
        #wb-timer { font-size: 11px; color: #555; }

        /* =============================================
           MOOD TOAST
        ============================================= */
        #mood-toast {
            position: absolute;
            top: 16px;
            right: 16px;
            background: rgba(30,30,30,0.92);
            border: 1px solid #FFD70055;
            border-radius: 12px;
            padding: 10px 16px;
            font-size: 13px;
            color: #FFD700;
            max-width: 220px;
            text-align: center;
            backdrop-filter: blur(8px);
            opacity: 0;
            transform: translateY(-10px);
            transition: opacity 0.4s, transform 0.4s;
            pointer-events: none;
            z-index: 20;
        }
        #mood-toast.show {
            opacity: 1;
            transform: translateY(0);
        }
        @media screen and (max-width: 768px) {

            /* 1. Lock the screen height perfectly */
            body {
                display: flex !important;
                flex-direction: column !important;
                height: 100dvh !important;
                margin: 0 !important;
                overflow: hidden !important;
            }

            /* 2. Header Box */
            header,
            #header,
            .header-container,
            .top-bar {
                display: flex !important;
                flex-direction: column !important;
                width: 100% !important;
                padding: 5px 10px !important;
                order: 1 !important;
                box-sizing: border-box;
            }

            header h1 {
                font-size: 20px !important;
                margin: 2px 0 8px 0 !important;
            }

            /* 3. Wrap the Top Controls */
            .controls,
            #controls,
            .top-controls,
            .selectors {
                display: flex !important;
                flex-direction: row !important;
                flex-wrap: wrap !important;
                justify-content: space-between !important;
                width: 100% !important;
                gap: 5px !important;
            }

            select {
                width: 48% !important;
                padding: 8px 4px !important;
                font-size: 12px !important;
                box-sizing: border-box !important;
            }

            #toggle-mic {
                width: 100% !important;
                margin-top: 2px !important;
                padding: 8px !important;
                font-size: 14px !important;
            }

            /* 4. Avatar Box */
            #avatar-container {
                width: 100% !important;
                height: 25vh !important;
                order: 2 !important;
                grid-area: auto !important;
            }

            /* 5. Chat Sidebar */
            #chat-sidebar {
                width: 100% !important;
                flex: 1 1 auto !important;
                order: 3 !important;
                border: none !important;
                box-sizing: border-box !important;
                overflow-y: auto !important;
            }

            /* 6. PIN AND FIX THE INPUT BOX */
            #input-container {
                width: 100% !important;
                flex: 0 0 auto !important;
                order: 4 !important;
                box-sizing: border-box !important;
                padding: 10px 5px !important;
                /* Slightly tighter padding on the edges */
                display: flex !important;
                align-items: center !important;
                justify-content: space-between !important;
                gap: 6px !important;
                /* Smaller gap so everything fits nicely */
                background: #121212 !important;
                border-top: 1px solid #333 !important;
                padding-bottom: 20px !important;
            }

            #text-input {
                flex: 1 1 0% !important;
                /* Tells the box it is allowed to shrink */
                min-width: 0 !important;
                /* THE MAGIC FIX: Overrides default input widths */
                font-size: 16px !important;
                padding: 12px 15px !important;
                margin: 0 !important;
                border-radius: 20px !important;
                box-sizing: border-box !important;
            }

            /* Protect the buttons from being squished */
            #upload-btn,
            #mic-btn,
            #send-btn {
                flex-shrink: 0 !important;
                /* NEVER SHRINK */
                padding: 8px !important;
                margin: 0 !important;
                box-sizing: border-box !important;
            }

            /* Tweak icon sizes slightly for mobile */
            #upload-btn,
            #mic-btn {
                font-size: 20px !important;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>Jack <span>Your AI Guide</span></h1>
        <div class="controls">
            <select id="voice-select"></select>
            <select id="model-select">
                <option value="llama-3.3-70b-versatile">Llama 3.3 70B</option>
                <option value="llama-3.1-8b-instant">Llama 3.1 8B (Fast)</option>
                <option value="mixtral-8x7b-32768">Mixtral 8x7B</option>
                <option value="gemma2-9b-it">Gemma 2 9B</option>
            </select>
            <button id="toggle-mic">Start Voice (V)</button>
        </div>
    </header>

    <div id="chat-sidebar">
        <div id="chat-sidebar-header">
            <span>💬 Conversation</span>
            <div style="display:flex;gap:6px;">
                <button class="sidebar-btn" id="topics-btn" title="Toggle Topics">🧠 Topics</button>
                <button class="sidebar-btn" id="clear-btn" title="Clear chat">🗑️ Clear</button>
            </div>
        </div>
        <div id="memory-panel">
            <h4>📌 Topics Discussed</h4>
            <div id="topics-list"><span style="color:#555;font-style:italic;">No topics yet.</span></div>
        </div>
        <div id="chat-log"></div>
    </div>

    <div id="avatar-container">
        <span id="status-indicator">Idle</span>

        <!-- Question counter badge -->
        <div id="q-counter" title="Questions answered">
            <span id="q-count">0</span><span id="q-label"> / 10</span>
        </div>

        <!-- Water break status (glass lives in Three.js scene) -->
        <div id="water-break-overlay">
            <div id="wb-status-card">
                <div id="wb-emoji-icon">💧</div>
                <div id="wb-status-text">Jack is taking a water break...</div>
                <div id="wb-progress-wrap"><div id="wb-progress-bar"></div></div>
                <div id="wb-timer">Resuming in <span id="wb-seconds">12</span>s</div>
            </div>
        </div>

        <!-- Mood toast pop-ups -->
        <div id="mood-toast"></div>

        <div id="visualizer-overlay"></div>
    </div>

    <div id="input-container">
        <input type="file" id="image-upload" accept="image/png, image/jpeg, image/webp" style="display: none;" />
        <button id="upload-btn" title="Upload Image"
            style="background: transparent; border: none; font-size: 20px; cursor: pointer;">📎</button>

        <button id="mic-btn" title="Toggle Voice (V)"
            style="background: transparent; border: none; font-size: 20px; cursor: pointer; color: white;">🎤</button>

        <input type="text" id="text-input" placeholder="Type, say something (V), or attach files..." />
        <button id="send-btn">Send</button>
    </div>

    <script>
        /**
         * ==========================================
         * 1. 3D AVATAR ENGINE (REWRITTEN)
         * ==========================================
         */
        const AvatarEngine = (() => {
            let scene, camera, renderer, clock;
            let jackModel;
            let breathingTime = 0;
            let isInitialized = false;

            let faceMeshes = [];
            let headBone, spineBone, rightArmBone, rightForeArmBone, rightHandBone;
            let targetMouthOpen = 0;

            // ---- Bone animation targets (lerped every frame) ----
            let boneTargets = {};  // boneName -> { x, y, z } target rotation
            let boneDefaults = {}; // boneName -> original rotation snapshot

            // ---- 3D Glass object in scene ----
            let glassGroup = null;
            let glassRestPos = new THREE.Vector3(0.38, 0.88, 0.15);
            let glassDrinkPos = new THREE.Vector3(0.08, 1.38, 0.25);
            let glassAnimating = false;

            function lerp(a, b, t) { return a + (b - a) * t; }

            function lerpBones(speed) {
                for (const [name, target] of Object.entries(boneTargets)) {
                    const bone = jackModel ? (jackModel.getObjectByName(name) || jackModel.getObjectByName('mixamoring' + name)) : null;
                    if (!bone) continue;
                    bone.rotation.x = lerp(bone.rotation.x, target.x, speed);
                    bone.rotation.y = lerp(bone.rotation.y, target.y, speed);
                    bone.rotation.z = lerp(bone.rotation.z, target.z, speed);
                }
            }

            function setBoneTarget(name, x, y, z) {
                boneTargets[name] = { x, y, z };
            }

            function resetBoneTarget(name) {
                if (boneDefaults[name]) {
                    boneTargets[name] = { ...boneDefaults[name] };
                }
            }

            function buildGlass() {
                glassGroup = new THREE.Group();

                // Glass body (cylinder, tapered slightly)
                const bodyGeo = new THREE.CylinderGeometry(0.03, 0.025, 0.1, 16, 1, true);
                const glassMat = new THREE.MeshPhysicalMaterial({
                    color: 0xaaddff, transparent: true, opacity: 0.25,
                    roughness: 0, metalness: 0, side: THREE.DoubleSide
                });
                const body = new THREE.Mesh(bodyGeo, glassMat);
                glassGroup.add(body);

                // Water inside
                const waterGeo = new THREE.CylinderGeometry(0.028, 0.023, 0.065, 16);
                const waterMat = new THREE.MeshPhongMaterial({
                    color: 0x55aaff, transparent: true, opacity: 0.55
                });
                const water = new THREE.Mesh(waterGeo, waterMat);
                water.position.y = -0.017;
                glassGroup.add(water);

                // Glass bottom
                const bottomGeo = new THREE.CylinderGeometry(0.025, 0.025, 0.006, 16);
                const bottomMat = new THREE.MeshPhongMaterial({ color: 0x88bbdd, transparent: true, opacity: 0.4 });
                const bottom = new THREE.Mesh(bottomGeo, bottomMat);
                bottom.position.y = -0.05;
                glassGroup.add(bottom);

                // Coaster (flat disc under glass)
                const coasterGeo = new THREE.CylinderGeometry(0.04, 0.04, 0.005, 20);
                const coasterMat = new THREE.MeshPhongMaterial({ color: 0x5a3a18 });
                const coaster = new THREE.Mesh(coasterGeo, coasterMat);
                coaster.position.y = -0.055;
                glassGroup.add(coaster);

                // Small table surface
                const tableGeo = new THREE.BoxGeometry(0.18, 0.012, 0.14);
                const tableMat = new THREE.MeshPhongMaterial({ color: 0x3a2510 });
                const table = new THREE.Mesh(tableGeo, tableMat);
                table.position.y = -0.063;
                glassGroup.add(table);

                glassGroup.position.copy(glassRestPos);
                scene.add(glassGroup);

                // Subtle glow light near glass
                const glassLight = new THREE.PointLight(0x88ccff, 0.3, 0.5);
                glassLight.position.copy(glassRestPos);
                scene.add(glassLight);
            }

            function init() {
                const container = document.getElementById('avatar-container');
                scene = new THREE.Scene();

                camera = new THREE.PerspectiveCamera(35, container.offsetWidth / container.offsetHeight, 0.1, 1000);
                camera.position.set(0, 1.45, 1.3);
                camera.lookAt(0, 1.45, 0);

                renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
                renderer.setPixelRatio(window.devicePixelRatio);
                renderer.setSize(container.offsetWidth, container.offsetHeight);
                renderer.outputEncoding = THREE.sRGBEncoding;
                container.appendChild(renderer.domElement);

                clock = new THREE.Clock();

                const ambientLight = new THREE.AmbientLight(0xFFFFFF, 0.6);
                scene.add(ambientLight);
                const spotLight = new THREE.SpotLight(0xFFFFFF, 1.2);
                spotLight.position.set(2, 5, 5);
                scene.add(spotLight);
                const catchLight = new THREE.PointLight(0xFFD700, 0.4);
                catchLight.position.set(-1, 1.5, 0.5);
                scene.add(catchLight);

                const loader = new THREE.GLTFLoader();
                loader.load('avatar.glb', (gltf) => {
                    jackModel = gltf.scene;
                    scene.add(jackModel);

                    headBone   = jackModel.getObjectByName('Head')        || jackModel.getObjectByName('mixamorigHead');
                    spineBone  = jackModel.getObjectByName('Spine')       || jackModel.getObjectByName('mixamorigSpine');
                    rightArmBone     = jackModel.getObjectByName('RightArm')     || jackModel.getObjectByName('mixamorigRightArm');
                    rightForeArmBone = jackModel.getObjectByName('RightForeArm') || jackModel.getObjectByName('mixamorigRightForeArm');
                    rightHandBone    = jackModel.getObjectByName('RightHand')    || jackModel.getObjectByName('mixamorigRightHand');

                    if (rightArmBone) {
                        rightArmBone.rotation.z -= 0.35;
                        rightArmBone.rotation.x += 0.15;
                        boneDefaults['RightArm']     = { x: rightArmBone.rotation.x,     y: rightArmBone.rotation.y,     z: rightArmBone.rotation.z };
                    }
                    if (rightForeArmBone) {
                        boneDefaults['RightForeArm'] = { x: rightForeArmBone.rotation.x, y: rightForeArmBone.rotation.y, z: rightForeArmBone.rotation.z };
                    }
                    if (rightHandBone) {
                        boneDefaults['RightHand']    = { x: rightHandBone.rotation.x,    y: rightHandBone.rotation.y,    z: rightHandBone.rotation.z };
                    }

                    const leftArm = jackModel.getObjectByName('LeftArm') || jackModel.getObjectByName('mixamorigLeftArm');
                    if (leftArm) { leftArm.rotation.z += 0.35; leftArm.rotation.x += 0.15; }

                    // Map morph targets
                    jackModel.traverse((child) => {
                        if (child.isMesh && child.morphTargetDictionary) {
                            const dict = child.morphTargetDictionary;
                            let meshData = { mesh: child, mouthIndex: -1, blinkIndex: -1 };
                            for (let key of ['viseme_O', 'viseme_aa', 'mouthOpen', 'jawOpen'])
                                if (dict[key] !== undefined) { meshData.mouthIndex = dict[key]; break; }
                            for (let key of ['eyeBlinkLeft', 'EyeBlinkLeft', 'blinkLeft'])
                                if (dict[key] !== undefined) { meshData.blinkIndex = dict[key]; break; }
                            if (meshData.mouthIndex !== -1 || meshData.blinkIndex !== -1)
                                faceMeshes.push(meshData);
                        }
                    });

                    buildGlass();
                    isInitialized = true;
                });

                window.addEventListener('resize', onWindowResize, false);
                animate();
            }

            function onWindowResize() {
                const container = document.getElementById('avatar-container');
                camera.aspect = container.offsetWidth / container.offsetHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(container.offsetWidth, container.offsetHeight);
            }

            function animate() {
                requestAnimationFrame(animate);
                if (!isInitialized) return;

                const delta = clock.getDelta();
                breathingTime += delta * 1.5;

                if (spineBone) spineBone.rotation.x = Math.sin(breathingTime) * 0.015;

                if (headBone && window.appState === 'speaking') {
                    headBone.rotation.x = Math.sin(breathingTime * 4) * 0.02;
                } else if (headBone && !glassAnimating) {
                    headBone.rotation.x = 0;
                    headBone.rotation.y = Math.sin(breathingTime * 0.5) * 0.05;
                }

                // Smooth bone animation targets
                lerpBones(0.07);

                // SMOOTH LIP SYNC
                if (faceMeshes.length > 0) {
                    faceMeshes.forEach(data => {
                        if (data.mouthIndex !== -1) {
                            let current = data.mesh.morphTargetInfluences[data.mouthIndex];
                            data.mesh.morphTargetInfluences[data.mouthIndex] += (targetMouthOpen - current) * 0.35;
                        }
                    });
                }

                renderer.render(scene, camera);
            }

            // -----------------------------------------------
            // DRINKING ANIMATION - moves arm bones + glass
            // -----------------------------------------------
            function playDrinkAnimation(onDone) {
                if (!isInitialized || !jackModel) { if (onDone) onDone(); return; }
                glassAnimating = true;

                const REACH_MS   = 900;   // arm reaches down to glass
                const LIFT_MS    = 700;   // lifts glass up
                const DRINK_MS   = 2800;  // drinking phase (3 gulps)
                const LOWER_MS   = 700;   // lowers glass back
                const RETURN_MS  = 900;   // arm returns to side

                const totalMs = REACH_MS + LIFT_MS + DRINK_MS + LOWER_MS + RETURN_MS;

                // --- PHASE 1: Reach down ---
                setBoneTarget('RightArm',     -0.6,  0.1, -0.55);
                setBoneTarget('RightForeArm',  0.8,  0.0,  0.0);
                setBoneTarget('RightHand',     0.3,  0.0,  0.0);
                if (headBone) { headBone.rotation.y = -0.15; }

                // Animate glass moving up to hand
                const glassStartPos = glassGroup.position.clone();
                const startT = performance.now();

                function animateGlass() {
                    if (!glassAnimating) return;
                    const now = performance.now();
                    const elapsed = now - startT;

                    if (elapsed < REACH_MS) {
                        // Phase 1: glass stays, arm reaches
                        requestAnimationFrame(animateGlass);
                    } else if (elapsed < REACH_MS + LIFT_MS) {
                        // Phase 2: lift glass with arm
                        const t = (elapsed - REACH_MS) / LIFT_MS;
                        const ease = t < 0.5 ? 2*t*t : -1+(4-2*t)*t;
                        glassGroup.position.lerpVectors(glassStartPos, glassDrinkPos, ease);
                        glassGroup.rotation.z = ease * (-0.2); // slight tilt toward face
                        setBoneTarget('RightArm',    -0.9, 0.05, -0.5);
                        setBoneTarget('RightForeArm', 1.4,  0.0,  0.0);
                        requestAnimationFrame(animateGlass);
                    } else if (elapsed < REACH_MS + LIFT_MS + DRINK_MS) {
                        // Phase 3: drinking - tilt glass & bob head
                        const t = (elapsed - REACH_MS - LIFT_MS) / DRINK_MS;
                        const tiltAngle = -0.3 + Math.sin(t * Math.PI) * -0.35;
                        glassGroup.rotation.z = tiltAngle;
                        // Head tilts back slightly while drinking
                        if (headBone) headBone.rotation.x = lerp(0, -0.12, Math.sin(t * Math.PI));
                        // Gulping: arm bobs 3 times
                        const gulp = Math.sin(t * Math.PI * 3) * 0.06;
                        if (rightForeArmBone) rightForeArmBone.rotation.x = 1.4 + gulp;
                        requestAnimationFrame(animateGlass);
                    } else if (elapsed < REACH_MS + LIFT_MS + DRINK_MS + LOWER_MS) {
                        // Phase 4: lower glass back to table
                        const t = (elapsed - REACH_MS - LIFT_MS - DRINK_MS) / LOWER_MS;
                        const ease = t < 0.5 ? 2*t*t : -1+(4-2*t)*t;
                        glassGroup.position.lerpVectors(glassDrinkPos, glassRestPos, ease);
                        glassGroup.rotation.z = lerp(glassGroup.rotation.z, 0, 0.1);
                        setBoneTarget('RightArm',    -0.6, 0.1, -0.55);
                        setBoneTarget('RightForeArm', 0.8,  0.0,  0.0);
                        if (headBone) headBone.rotation.x = 0;
                        requestAnimationFrame(animateGlass);
                    } else if (elapsed < totalMs) {
                        // Phase 5: arm returns to rest
                        glassGroup.position.copy(glassRestPos);
                        glassGroup.rotation.z = 0;
                        resetBoneTarget('RightArm');
                        resetBoneTarget('RightForeArm');
                        resetBoneTarget('RightHand');
                        if (headBone) headBone.rotation.y = 0;
                        requestAnimationFrame(animateGlass);
                    } else {
                        glassAnimating = false;
                        if (onDone) onDone();
                    }
                }
                requestAnimationFrame(animateGlass);
            }

            function updateMouth(isSpeaking, averageVolume) {
                if (!isInitialized || faceMeshes.length === 0) return;
                if (isSpeaking && averageVolume > 0.02) {
                    targetMouthOpen = Math.min(averageVolume * 6.0, 0.85);
                } else {
                    targetMouthOpen = 0;
                }
            }

            function blink() {
                if (!isInitialized || faceMeshes.length === 0) return;
                faceMeshes.forEach(data => {
                    if (data.blinkIndex !== -1) {
                        data.mesh.morphTargetInfluences[data.blinkIndex] = 1.0;
                        if (data.mesh.morphTargetInfluences[data.blinkIndex + 1] !== undefined)
                            data.mesh.morphTargetInfluences[data.blinkIndex + 1] = 1.0;
                    }
                });
                setTimeout(() => {
                    faceMeshes.forEach(data => {
                        if (data.blinkIndex !== -1) {
                            data.mesh.morphTargetInfluences[data.blinkIndex] = 0;
                            if (data.mesh.morphTargetInfluences[data.blinkIndex + 1] !== undefined)
                                data.mesh.morphTargetInfluences[data.blinkIndex + 1] = 0;
                        }
                    });
                }, 150);
            }

            let blinkInterval;
            function startBlinkLoop() {
                clearInterval(blinkInterval);
                function scheduleNextBlink() {
                    const delay = Math.random() * 4000 + 2500;
                    blinkInterval = setTimeout(() => { blink(); scheduleNextBlink(); }, delay);
                }
                scheduleNextBlink();
            }

            return { init, updateMouth, startBlinkLoop, playDrinkAnimation };
        })();

        /**
         * ==========================================
         * 2. REFINED AUDIO PROCESSING
         * ==========================================
         */
        const AudioEngine = (() => {
            let audioContext, analyser, microphone, scriptProcessor;
            let isActive = false;

            async function startInputStream() {
                if (isActive) return true;
                try {
                    audioContext = new (window.AudioContext || window.webkitAudioContext)();
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    microphone = audioContext.createMediaStreamSource(stream);
                    analyser = audioContext.createAnalyser();
                    analyser.smoothingTimeConstant = 0.2;
                    analyser.fftSize = 1024;
                    microphone.connect(analyser);

                    scriptProcessor = audioContext.createScriptProcessor(2048, 1, 1);
                    analyser.connect(scriptProcessor);
                    scriptProcessor.connect(audioContext.destination);

                    scriptProcessor.onaudioprocess = processAudio;
                    isActive = true;
                    return true;
                } catch (e) {
                    console.error("Audio engine failed:", e);
                    AppManager.setUIStatus("Mic Error");
                    isActive = false;
                    return false;
                }
            }

            function processAudio() {
                if (!isActive || !analyser) return;
                const dataArray = new Uint8Array(analyser.frequencyBinCount);
                analyser.getByteFrequencyData(dataArray);

                let sum = 0;
                for (let i = 0; i < dataArray.length; i++) {
                    sum += dataArray[i];
                }
                const average = (sum / dataArray.length) / 255;

                AvatarEngine.updateMouth(true, average);
                AppManager.updateVisualizer(dataArray);
            }

            function stopInputStream() {
                if (!isActive) return;
                if (scriptProcessor) scriptProcessor.disconnect();
                if (analyser) analyser.disconnect();
                if (microphone) microphone.mediaStream.getTracks()[0].stop();
                if (audioContext) audioContext.close();
                isActive = false;
                AvatarEngine.updateMouth(false, 0);
            }

            return { startInputStream, stopInputStream };
        })();

        /**
         * ==========================================
         * 3. REFINED SPEECH & STATE MANAGEMENT
         * ==========================================
         */
        const AppManager = (() => {
            let recognition, synth;
            let selectedVoice = null;
            let currentState = 'idle';
            let isToggledOn = false;
            let currentUtterance = null;
            let base64ImageData = null;
            let knowledgeBaseText = ""; // NEW: Jack's short-term memory bank
            let chatHistory = [];

            function init() {
                // Connect the new bottom Mic button
                const micBtn = document.getElementById('mic-btn');
                if (micBtn) {
                    micBtn.addEventListener('click', toggleAILife);
                }
                document.getElementById('send-btn').addEventListener('click', handleSendInput);

                });
                document.getElementById('voice-select').addEventListener('change', (e) => {
                    selectedVoice = synth.getVoices().find(v => v.voiceURI === e.target.value);
                });

                // 1. Image Upload Logic
                const imageUploadInput = document.getElementById('image-upload');
                const uploadBtn = document.getElementById('upload-btn');
                if (uploadBtn && imageUploadInput) {
                    uploadBtn.addEventListener('click', () => imageUploadInput.click());
                    imageUploadInput.addEventListener('change', function (event) {

                }

                // 2. NEW: Document Upload Logic (RAG Memory)
                const docUploadInput = document.getElementById('doc-upload');
                const docUploadBtn = document.getElementById('upload-doc-btn');
                if (docUploadBtn && docUploadInput) {
                    docUploadBtn.addEventListener('click', () => docUploadInput.click());
                    docUploadInput.addEventListener('change', function (event) {
                        const file = event.target.files[0];
                        if (file) {
                            const reader = new FileReader();
                            reader.onload = function (e) {
                                // Store the document text in Jack's memory variable
                                knowledgeBaseText = e.target.result;
                                addChatMessage('user', `<i>[Knowledge Base Uploaded: ${file.name}]. Jack has memorized this document.</i>`);
                            };

                            reader.readAsText(file);

                    });
                }

                synth = window.speechSynthesis;
                setTimeout(populateVoiceList, 100);
                synth.onvoiceschanged = populateVoiceList;

                const visualizer = document.getElementById('visualizer-overlay');
                visualizer.innerHTML = '';
                for (let i = 0; i < 30; i++) {
                    const bar = document.createElement('div');
                    bar.className = 'v-bar';
                    visualizer.appendChild(bar);
                }

                window.addEventListener('keydown', (e) => {
                    if (e.key.toLowerCase() === 'v' && document.activeElement.id !== 'text-input') toggleAILife();
                });
            }

            function populateVoiceList() {
                const voices = synth.getVoices();
                const select = document.getElementById('voice-select');
                select.innerHTML = '';
                if (voices.length === 0) return;

                const highQualityKeywords = ['Microsoft David', 'Google US English Male', 'en-US-Neural', 'Standard-B', 'Daniel', 'Male', 'UK', 'GB'];
                let prioritizedMaleVoices = [];
                let otherVoices = [];

                voices.forEach(voice => {
                    const isKnownMale = highQualityKeywords.some(keyword => voice.name.includes(keyword) || voice.voiceURI.includes(keyword));
                    if (isKnownMale && voice.lang.includes('en')) prioritizedMaleVoices.unshift(voice);
                    else otherVoices.push(voice);
                });

                const finalListOfVoices = prioritizedMaleVoices.concat(otherVoices);

                finalListOfVoices.forEach((voice, i) => {
                    const option = document.createElement('option');
                    let qualityTag = (prioritizedMaleVoices.includes(voice) && i < prioritizedMaleVoices.length - 3) ? '✨ ' : '';
                    option.textContent = qualityTag + voice.name + ' (' + voice.lang + ')';
                    option.value = voice.voiceURI;
                    if (i === 0) {
                        option.selected = true;
                        selectedVoice = voice;
                    }
                    select.appendChild(option);
                });
            }

            function toggleAILife() {
                isToggledOn = !isToggledOn;
                const topBtn = document.getElementById('toggle-mic');
                const bottomMic = document.getElementById('mic-btn');

                if (isToggledOn) {
                    // Turn both buttons ON (Gold)
                    if (topBtn) { topBtn.textContent = "Mic Active (V)"; topBtn.style.background = "#FFD700"; topBtn.style.color = "#121212"; }
                    if (bottomMic) { bottomMic.style.color = "#FFD700"; }
                    startListening();
                } else {
                    // Turn both buttons OFF (Default)
                    if (topBtn) { topBtn.textContent = "Start Voice (V)"; topBtn.style.background = "#2D2D2D"; topBtn.style.color = "white"; }
                    if (bottomMic) { bottomMic.style.color = "white"; }
                    stopListening();
                    synth.cancel();
                    setState('idle');
                }
            }

            function setState(state) {
                if (currentState === state) return;
                currentState = state;
                window.appState = state;
                setUIStatus(state.charAt(0).toUpperCase() + state.slice(1));
            }

            function setUIStatus(text) {
                document.getElementById('status-indicator').textContent = text;
                const vBars = document.querySelectorAll('.v-bar');
                if (text === 'Listening') {
                    document.getElementById('status-indicator').style.borderColor = "#FFD700";
                    vBars.forEach(bar => bar.style.backgroundColor = 'rgba(255, 215, 0, 0.4)');
                } else if (text === 'Speaking') {
                    document.getElementById('status-indicator').style.borderColor = "#ffffff";
                    vBars.forEach(bar => bar.style.backgroundColor = 'rgba(255, 255, 255, 0.4)');
                } else {
                    document.getElementById('status-indicator').style.borderColor = "#444";
                    vBars.forEach(bar => { bar.style.height = "10px"; bar.style.backgroundColor = 'rgba(255, 215, 0, 0.4)' });
                }
            }

            function handleSendInput() {
                const input = document.getElementById('text-input').value;
                // Allow sending if there is text OR an image attached
                if (!input && !base64ImageData) return;

                if (input) addChatMessage('user', input);
                document.getElementById('text-input').value = '';
                processQuery(input);
            }

            async function processQuery(query) {
                if (synth.speaking) synth.cancel();
                AudioEngine.stopInputStream();
                setState('thinking');
                showTypingIndicator();

                try {
                    let targetModel = document.getElementById('model-select').value;
                    let apiMessages = [];

                    // Build Jack's System Instructions
                    let systemInstructions = "You are Jack, a helpful AI guide. Keep responses concise.";
                    if (knowledgeBaseText !== "") {
                        systemInstructions += `\n\nUSER KNOWLEDGE BASE PROVIDED. You must use the following information to answer the user's questions. If the answer is not in the knowledge base, use your general knowledge.\n\n<knowledge>\n${knowledgeBaseText}\n</knowledge>`;
                    }

                    // Handle Vision vs Text formats
                    if (base64ImageData) {
                        targetModel = "meta-llama/llama-4-scout-17b-16e-instruct";
                        apiMessages = [
                            {
                                role: "user",
                                content: [
                                    { type: "text", text: (knowledgeBaseText ? "Knowledge Base: " + knowledgeBaseText.substring(0, 2000) + "\n\n" : "") + (query || "Please describe what is in this image.") },
                                    { type: "image_url", image_url: { url: base64ImageData } }
                                ]
                            }
                        ];
                        // Note: We intentionally don't save huge image blobs to chat history to save tokens
                    } else {

                        // NEW: Add the user's message to the memory bank
                        chatHistory.push({ role: "user", content: query });

                        // NEW: Limit memory to the last 10 messages so we don't crash the API with a massive payload
                        if (chatHistory.length > 10) {
                            chatHistory = chatHistory.slice(chatHistory.length - 10);
                        }

                        // NEW: Combine System Instructions with the entire Chat History using the spread operator (...)
                        apiMessages = [
                            { role: "system", content: systemInstructions },
                            ...chatHistory
                        ];
                    }

                    // Call the local Flask backend
                    // MAKE SURE YOU INCLUDE /api/chat AT THE END!
                    const response = await fetch("https://jack-ai-assistant.onrender.com/api/chat", {
                        method: "POST",
                        // ... the rest of your code stays the same
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            model: targetModel,
                            messages: apiMessages
                        })
                    });

                    const data = await response.json();
                    if (data.error) throw new Error(data.error);

                    const rawText = data.response;
                    const aiText = cleanTextForSpeech(rawText); // clean markdown for both display & speech
                    hideTypingIndicator();
                    addChatMessage('ai', aiText, true);

                    // Save clean text to memory (no markdown noise in history)
                    if (!base64ImageData) {
                        chatHistory.push({ role: "assistant", content: aiText });
                    }

                    // Cleanup buffers
                    base64ImageData = null;
                    if (document.getElementById('image-upload')) document.getElementById('image-upload').value = "";

                    // Track question count → triggers water break at multiples of 10
                    incrementQuestionCounter();

                    speak(aiText);

                } catch (error) {
                    console.error("Backend Error:", error);
                    hideTypingIndicator();
                    addChatMessage('ai', "Error connecting to Flask backend: " + error.message);
                    setState('idle');
                    base64ImageData = null;
                }
            }


            function cleanTextForSpeech(text) {
                return text
                    .replace(/\*\*(.+?)\*\*/g, '$1')
                    .replace(/\*(.+?)\*/g, '$1')
                    .replace(/__(.+?)__/g, '$1')
                    .replace(/_(.+?)_/g, '$1')
                    .replace(/^#{1,6}\s+/gm, '')
                    .replace(/```[\s\S]*?```/g, '')
                    .replace(/`(.+?)`/g, '$1')
                    .replace(/^\s*[-*+]\s+/gm, '')
                    .replace(/^\s*\d+\.\s+/gm, '')
                    .replace(/^>\s+/gm, '')
                    .replace(/^[-*_]{3,}\s*$/gm, '')
                    .replace(/\[(.+?)\]\(.*?\)/g, '$1')
                    .replace(/!\[.*?\]\(.*?\)/g, '')
                    .replace(/<[^>]+>/g, '')
                    .replace(/\n+/g, ' ')
                    .replace(/\s{2,}/g, ' ')
                    .trim();
            }

            function speak(text) {
                if (!selectedVoice) return;
                setState('speaking');

                currentUtterance = new SpeechSynthesisUtterance(text);
                currentUtterance.voice = selectedVoice;
                currentUtterance.pitch = 0.95;
                currentUtterance.rate = 1.0;

                currentUtterance.onstart = () => { simulateSpeakingAudio(currentUtterance.text.length); };
                currentUtterance.onend = () => {
                    simulateSpeakingAudioStop();
                    if (isToggledOn) startListening(); else setState('idle');
                };

                synth.speak(currentUtterance);
            }

            let speakVolumeSim;
            function simulateSpeakingAudio(charCount) {

                        AvatarEngine.updateMouth(true, vol);
                        updateVisualizerSim(vol);
                    }

            }

            function simulateSpeakingAudioStop() {
                if (speakVolumeSim) clearInterval(speakVolumeSim);
                AvatarEngine.updateMouth(false, 0);
                updateVisualizerSim(0);
            }

            function startListening() {
                if (!isToggledOn) return;
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

                if (!SpeechRecognition) {
                    addChatMessage('ai', "Error: Your browser does not support voice recognition. Please use Google Chrome or Edge.");
                    toggleAILife();
                    return;
                }

                recognition = new SpeechRecognition();
                recognition.continuous = false;
                recognition.interimResults = false;
                recognition.lang = 'en-US';

                recognition.onstart = () => {
                    console.log("🎤 Microphone is active and listening...");
                    setState('listening');
                };

                recognition.onresult = (e) => {
                    // FIXED: Changed e.resultIndex to e.results[0]
                    const transcript = e.results[0][0].transcript;
                    console.log("🗣️ Jack heard:", transcript);
                    document.getElementById('text-input').value = transcript;
                    setTimeout(handleSendInput, 300);
                };

                recognition.onerror = (e) => {
                    console.error("❌ Microphone Error:", e.error);

                    if (e.error === 'not-allowed') {
                        addChatMessage('ai', "Error: Microphone access is blocked. Check your browser permissions.");
                        toggleAILife();
                    }

                    if (e.error !== 'no-speech' && isToggledOn) recognition.start();
                };

                recognition.onend = () => {
                    console.log("🛑 Microphone stopped.");
                    if (isToggledOn && currentState === 'listening') { recognition.start(); }
                };

                try {
                    recognition.start();
                } catch (err) {
                    console.error("Failed to start recognition:", err);
                }
            }

            function stopListening() { if (recognition) recognition.abort(); }

            // ---- TOPICS TRACKER ----
            let topicsList = [];
            function extractAndAddTopic(text) {
                // Pull first meaningful noun phrase (first 4 words, cleaned)
                const cleaned = text.replace(/[^a-zA-Z0-9 ]/g, '').trim();
                const words = cleaned.split(' ').slice(0, 4).join(' ');
                if (words.length > 3 && !topicsList.includes(words)) {

            function renderTopics() {

                el.innerHTML = topicsList.map(t =>
                    `<span class="topic-tag">${t}</span>`

            // ---- TIMESTAMP HELPER ----
            function getTime() {

            // ---- TYPING INDICATOR ----
            let typingIndicatorEl = null;
            function showTypingIndicator() {

            // ---- TYPEWRITER EFFECT ----
            function typewriterEffect(bubbleEl, text, onDone) {
                const words = text.split(' ');
                let i = 0;
                bubbleEl.innerHTML = '';
                const cursor = document.createElement('span');
                cursor.className = 'typewriter-cursor';
                bubbleEl.appendChild(cursor);

                const interval = setInterval(() => {
                    if (i < words.length) {
                        cursor.insertAdjacentText('beforebegin', (i === 0 ? '' : ' ') + words[i]);
                        i++;
                        document.getElementById('chat-log').scrollTop = document.getElementById('chat-log').scrollHeight;
                    } else {
                        clearInterval(interval);
                        cursor.remove();
                        if (onDone) onDone();

            // ---- ADD CHAT MESSAGE (new bubble system) ----
            function addChatMessage(sender, text, animate = false) {
                const log = document.getElementById('chat-log');
                const isAI = sender === 'ai';
                const name = isAI ? 'Jack' : 'You';

                const wrapper = document.createElement('div');
                wrapper.className = `msg-wrapper ${isAI ? 'ai' : 'user'}`;

                const meta = document.createElement('div');
                meta.className = 'msg-meta';
                meta.innerHTML = `<span class="msg-sender">${name}</span><span>${getTime()}</span>
                    <button class="copy-btn" title="Copy" onclick="navigator.clipboard.writeText(this.dataset.text)" data-text="">⎘ Copy</button>`;

                const bubble = document.createElement('div');
                bubble.className = 'msg-bubble';

                wrapper.appendChild(bubble);
                wrapper.appendChild(meta);
                log.appendChild(wrapper);
                log.scrollTop = log.scrollHeight;

                if (isAI && animate) {
                    typewriterEffect(bubble, text, () => {
                        meta.querySelector('.copy-btn').dataset.text = text;
                    });
                } else {
                    bubble.textContent = text;
                    meta.querySelector('.copy-btn').dataset.text = text;
                }

                if (isAI) extractAndAddTopic(text);

                return bubble;
            }

            // ---- CLEAR CHAT ----
            function clearChat() {
                const log = document.getElementById('chat-log');
                log.innerHTML = '';
                chatHistory = [];
                topicsList = [];
                renderTopics();
                addChatMessage('ai', 'Chat cleared. How can I help you?');
            }

            function updateVisualizer(dataArray) {
                if (currentState !== 'listening' || !isToggledOn) return;
                const vBars = document.querySelectorAll('.v-bar');
                const bufferLength = dataArray.length;
                const barCount = vBars.length;
                const step = Math.floor(bufferLength / barCount);

                for (let i = 0; i < barCount; i++) {
                    let sum = 0;
                    for (let j = 0; j < step; j++) { sum += dataArray[i * step + j]; }
                    const average = sum / step;
                    let height = 10 + (average * 1.5);
                    height = Math.min(height, 80);
                    vBars[i].style.height = height + 'px';
                    if (height > 50) vBars[i].style.backgroundColor = 'rgba(255, 215, 0, 0.8)'; else vBars[i].style.backgroundColor = 'rgba(255, 215, 0, 0.4)';
                }
            }

            function updateVisualizerSim(volume) {
                const vBars = document.querySelectorAll('.v-bar');
                const barCount = vBars.length;

                for (let i = 0; i < barCount; i++) {
                    let v_noise = Math.random() * 20;
                    let height = 10 + (volume * 200) + v_noise;
                    height = Math.min(height, 80);
                    vBars[i].style.height = height + 'px';
                    if (height > 50) vBars[i].style.backgroundColor = 'rgba(255, 255, 255, 0.8)'; else vBars[i].style.backgroundColor = 'rgba(255, 255, 255, 0.4)';
                }
            }

            // =============================================
            // QUESTION COUNTER & WATER BREAK ENGINE
            // =============================================
            let questionCount = 0;
            let isOnBreak = false;

            const moodMessages = [
                { emoji: "🤔", text: "Hmm, great question! Let me think..." },
                { emoji: "💡", text: "Oh! I love this topic!" },
                { emoji: "😄", text: "Happy to help with that!" },
                { emoji: "🧠", text: "Interesting! My circuits are buzzing..." },
                { emoji: "📚", text: "Let me dig into my knowledge..." },
                { emoji: "✨", text: "This is a fun one!" },
                { emoji: "🎯", text: "Great question, right on point!" },
                { emoji: "🚀", text: "On it at the speed of light!" },
            ];

            const breakPhrases = [
                "Taking a quick sip... even AIs need hydration! 💧",
                "Brb, refueling with H₂O ☕",
                "10 questions answered — break time! 🥤",
                "Stay hydrated, friends! Back in a sec 💦",
            ];

            function incrementQuestionCounter() {
                questionCount++;
                const el = document.getElementById('q-count');
                const counter = document.getElementById('q-counter');
                if (el) el.textContent = questionCount;

                // Pulse animation on counter
                if (counter) {
                    counter.classList.remove('pulse');
                    void counter.offsetWidth; // reflow
                    counter.classList.add('pulse');
                }

                // Every 10 questions → water break
                if (questionCount % 10 === 0) {
                    setTimeout(() => triggerWaterBreak(), 800);
                } else {
                    // Random mood toast (30% chance)
                    if (Math.random() < 0.30) {
                        const mood = moodMessages[Math.floor(Math.random() * moodMessages.length)];
                        showMoodToast(mood.emoji + ' ' + mood.text);
                    }
                }
            }

            // ---- Web Audio: procedural water gulping sound ----
            function playWaterDrinkSound() {
                try {
                    const ctx = new (window.AudioContext || window.webkitAudioContext)();

                    function playGulp(startTime, volume) {
                        // Gurgle oscillator
                        const osc = ctx.createOscillator();
                        const gainNode = ctx.createGain();
                        const filter = ctx.createBiquadFilter();

                        filter.type = 'bandpass';
                        filter.frequency.setValueAtTime(400, startTime);
                        filter.frequency.exponentialRampToValueAtTime(200, startTime + 0.18);
                        filter.Q.value = 3;

                        osc.type = 'sine';
                        osc.frequency.setValueAtTime(380, startTime);
                        osc.frequency.exponentialRampToValueAtTime(160, startTime + 0.22);

                        gainNode.gain.setValueAtTime(0, startTime);
                        gainNode.gain.linearRampToValueAtTime(volume, startTime + 0.04);
                        gainNode.gain.exponentialRampToValueAtTime(0.001, startTime + 0.28);

                        osc.connect(filter);
                        filter.connect(gainNode);
                        gainNode.connect(ctx.destination);

                        osc.start(startTime);
                        osc.stop(startTime + 0.3);

                        // Swallow click sound
                        const clickBuf = ctx.createBuffer(1, ctx.sampleRate * 0.05, ctx.sampleRate);
                        const data = clickBuf.getChannelData(0);
                        for (let i = 0; i < data.length; i++) {
                            data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (ctx.sampleRate * 0.01));
                        }
                        const clickSrc = ctx.createBufferSource();
                        const clickFilter = ctx.createBiquadFilter();
                        clickFilter.type = 'lowpass';
                        clickFilter.frequency.value = 600;
                        const clickGain = ctx.createGain();
                        clickGain.gain.setValueAtTime(volume * 0.4, startTime + 0.22);
                        clickSrc.buffer = clickBuf;
                        clickSrc.connect(clickFilter);
                        clickFilter.connect(clickGain);
                        clickGain.connect(ctx.destination);
                        clickSrc.start(startTime + 0.22);
                    }

                    // 3 gulps with realistic timing
                    playGulp(ctx.currentTime + 0.1,  0.28);
                    playGulp(ctx.currentTime + 0.65, 0.22);
                    playGulp(ctx.currentTime + 1.15, 0.18);

                    // Glass set-down clink at the end (2.8s into animation)
                    setTimeout(() => {
                        try {
                            const ctx2 = new (window.AudioContext || window.webkitAudioContext)();
                            const clinkBuf = ctx2.createBuffer(1, ctx2.sampleRate * 0.3, ctx2.sampleRate);
                            const cd = clinkBuf.getChannelData(0);
                            for (let i = 0; i < cd.length; i++) {
                                cd[i] = Math.sin(i * 0.08) * Math.exp(-i / (ctx2.sampleRate * 0.04))
                                      + Math.sin(i * 0.13) * Math.exp(-i / (ctx2.sampleRate * 0.025)) * 0.5;
                            }
                            const clinkSrc = ctx2.createBufferSource();
                            const clinkGain = ctx2.createGain();
                            clinkGain.gain.setValueAtTime(0.35, 0);
                            clinkSrc.buffer = clinkBuf;
                            clinkSrc.connect(clinkGain);
                            clinkGain.connect(ctx2.destination);
                            clinkSrc.start();
                        } catch(e) {}
                    }, 5200);

                } catch(e) {
                    console.warn('Water sound failed:', e);
                }
            }

            function triggerWaterBreak() {
                isOnBreak = true;
                const overlay = document.getElementById('water-break-overlay');
                const bar = document.getElementById('wb-progress-bar');
                const secEl = document.getElementById('wb-seconds');
                const statusText = document.getElementById('wb-status-text');
                if (!overlay) return;

                const phrase = breakPhrases[Math.floor(Math.random() * breakPhrases.length)];
                addChatMessage('ai', phrase);
                speak(phrase);

                overlay.classList.add('active');

                // Reset progress bar
                if (bar) {
                    const fresh = bar.cloneNode(true);
                    bar.parentNode.replaceChild(fresh, bar);
                }

                // Show status messages keyed to animation phases
                const statusMessages = [
                    { t: 0,    txt: '🤚 Reaching for the glass...' },
                    { t: 900,  txt: '🥤 Picking up the glass...' },
                    { t: 1600, txt: '💧 Drinking water... *gulp gulp*' },
                    { t: 4500, txt: '👋 Putting glass back...' },
                    { t: 5500, txt: '😊 All refreshed!' },
                ];
                statusMessages.forEach(({ t, txt }) => {
                    setTimeout(() => { if (statusText) statusText.textContent = txt; }, t);
                });

                // Play the 3D arm + glass drink animation
                AvatarEngine.playDrinkAnimation(() => {
                    // Called when animation fully done (~7s)
                    overlay.classList.remove('active');
                    isOnBreak = false;
                    showMoodToast('😊 Back and refreshed! Ask me anything.');
                });

                // Play water sounds 1.6s in (when drinking phase starts)
                setTimeout(() => playWaterDrinkSound(), 1600);

                // Countdown timer (12s total matches animation)
                let secs = 12;
                if (secEl) secEl.textContent = secs;
                const countdown = setInterval(() => {
                    secs--;
                    if (secEl) secEl.textContent = Math.max(secs, 0);
                    if (secs <= 0) clearInterval(countdown);
                }, 1000);
            }

            function showMoodToast(text, duration = 3000) {
                const toast = document.getElementById('mood-toast');
                if (!toast) return;
                toast.textContent = text;
                toast.classList.add('show');
                setTimeout(() => toast.classList.remove('show'), duration);
            }

            return { init, handleSendInput, toggleAILife, setUIStatus, addChatMessage, processQuery, speak, startListening, updateVisualizer, simulateSpeakingAudioStop, incrementQuestionCounter, showMoodToast };
        })();

        // ==========================================
        // 4. MAIN APP INITIALIZATION
        // ==========================================
        document.addEventListener('DOMContentLoaded', () => {
            AvatarEngine.init();
            AppManager.init();
            AppManager.addChatMessage('ai', 'Hello, my name is Jack. How can I assist you today?');
            setTimeout(() => {
                AppManager.showMoodToast('👋 Hi! Ask me anything!', 4000);
                if (typeof AvatarEngine !== 'undefined') {
                    AvatarEngine.startBlinkLoop();
                }
            }, 1200);
        });
    </script>
